<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>IG Template B — Promo / Conseil produit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    margin: 0;
    padding: 0;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── CANVAS — no rounded corners ── */
  .canvas {
    width: 1080px;
    height: 1080px;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #FEF0E6; /* pastel peach — promo bg */
  }

  /* ── TOP ZONE — brand/product area ── */
  .top-zone {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 64px 40px;
    gap: 36px;
  }

  /* ── NOS CONSEILS BADGE ── */
  .badge {
    position: absolute;
    top: 36px;
    left: 36px;
    background: #2D5F5D;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 22px 10px 18px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    flex-shrink: 0;
  }

  /* ── BRAND LOGO ZONE ── */
  .brand-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 220px;
    height: 100px;
    background: rgba(255,255,255,0.55);
    border-radius: 16px;
    padding: 16px 24px;
  }

  .brand-zone img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* ── PRODUCT IMAGE ── */
  .product-zone {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-top: -20px;
  }

  .product-zone img {
    max-width: 680px;
    max-height: 400px;
    object-fit: contain;
    filter: drop-shadow(0 12px 32px rgba(45,95,93,0.18));
  }

  /* ── CONTENT CARD ── */
  .content-card {
    position: relative;
    background: #E8F0EA; /* pastel sage */
    border-radius: 28px 28px 0 0;
    z-index: 5;
    padding: 40px 48px 0 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    /* fixed height so footer always visible */
    height: 380px;
    flex-shrink: 0;
  }

  /* ── CARD HEADER ROW ── */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #2D5F5D;
  }

  .category-tag {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: #4B5563;
    background: rgba(255,255,255,0.7);
    border-radius: 9999px;
    padding: 7px 20px;
  }

  /* ── TITLE ── */
  .article-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.1;
    color: #1F2121;
    letter-spacing: -0.01em;
  }

  /* ── TEASER ── */
  .teaser {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.5;
    color: #4B5563;
    max-width: 720px;
  }

  /* ── CTA BUTTON ── */
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #2D5F5D;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    padding: 16px 34px;
    border-radius: 9999px;
    letter-spacing: 0.01em;
    align-self: flex-start;
    margin-top: auto;
    margin-bottom: 0;
  }

  /* ── FOOTER BAR ── */
  .footer-bar {
    height: 76px;
    background: #2D5F5D;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .footer-icon {
    width: 26px;
    height: 26px;
    border: 2.5px solid rgba(255,255,255,0.85);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    flex-shrink: 0;
  }

  .footer-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- TOP ZONE — product/brand visual -->
  <div class="top-zone">
    <div class="badge">
      <span class="badge-dot"></span>
      NOS CONSEILS
    </div>

    <!-- PRODUCT IMAGE — remplacer src par l'image du produit -->
    <div class="product-zone">
      <img
        src="../../images/Blog photos/blog-27-trousse-de-voyage.jpg"
        alt="{NOM_PRODUIT}"
      >
    </div>
  </div>

  <!-- CONTENT CARD -->
  <div class="content-card">

    <div class="card-header">
      <span class="card-label">Conseil produit</span>
      <span class="category-tag">{CATEGORIE}</span>
    </div>

    <h1 class="article-title">{TITRE_COURT}</h1>

    <p class="teaser">{TEASER}</p>

    <span class="cta-btn">lien dans la bio &nbsp;→</span>

  </div>

  <!-- FOOTER -->
  <div class="footer-bar">
    <div class="footer-icon">+</div>
    <span class="footer-name">Pharmacie Charnal · Quéven</span>
  </div>

</div>
</body>
</html>
