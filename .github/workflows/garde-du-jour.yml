name: Garde du jour

# Met à jour chaque matin la pharmacie de garde de JOURNÉE affichée sur la page,
# sans dépendre d'un poste de travail. Tourne sur les runners GitHub.
#
# Le planning ne vit PAS dans ce dépôt. Il est fourni par le secret
# PLANNING_GARDES_JOUR, qui ne contient que les gardes de journée : les gardes
# de nuit ne quittent jamais le poste de Dany. Voir CLAUDE.md, règle de sécurité.
#
# Pour (re)poser le secret depuis le Mac :
#   gh secret set PLANNING_GARDES_JOUR --repo Marcvrick/PHCIE \
#     < "$HOME/Library/Mobile Documents/com~apple~CloudDocs/MarcOS/Pharma/GESTION/Plannings de garde/planning-gardes-JOUR-uniquement.json"
#
# `main` n'est JAMAIS touché par ce workflow (branch protection posée le 19
# avril 2026, après un force-push qui avait écrasé l'historique public du
# site). La valeur du jour vit sur `garde-data`, une branche dédiée, non
# protégée, jamais déployée : seul ce fichier JSON y est amendé chaque jour
# (voir "Publier sur garde-data" ci-dessous). La page va le chercher par
# fetch() au chargement — voir pharmacie-de-garde-queven-hennebont-lorient.html.

on:
  schedule:
    # 05:10 UTC = 07:10 à Paris l'été, 06:10 l'hiver. Avant l'ouverture (9h).
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garde-du-jour
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (lecture seule, jamais modifié)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout garde-data (branche dédiée, non protégée)
        uses: actions/checkout@v4
        with:
          ref: garde-data
          path: garde-data
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Le secret doit être posé
        env:
          PLANNING_GARDES_JOUR: ${{ secrets.PLANNING_GARDES_JOUR }}
        run: |
          if [ -z "$PLANNING_GARDES_JOUR" ]; then
            echo "::error::Secret PLANNING_GARDES_JOUR absent. Voir l'en-tête de ce fichier."
            exit 1
          fi

      - name: Calculer et vérifier la garde du jour (bloquant)
        working-directory: site
        env:
          PLANNING_GARDES_JOUR: ${{ secrets.PLANNING_GARDES_JOUR }}
          TZ: Europe/Paris
        run: |
          python3 update-garde-du-jour.py --out ../garde-data/garde.json
          python3 update-garde-du-jour.py --check --out ../garde-data/garde.json

      - name: Publier sur garde-data (jamais sur main)
        working-directory: garde-data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garde.json
          if git diff --cached --quiet; then
            echo "Aucun changement, rien à publier."
            exit 0
          fi
          MSG="Garde du jour: $(TZ=Europe/Paris date +%Y-%m-%d)"

          # Cette branche ne sert qu'à porter la valeur du jour : elle n'est ni
          # déployée ni destinée à être consultée. Un commit par jour y
          # archiverait pourtant la même fuite que sur main (116 noms par an,
          # rotation extrapolable — voir CLAUDE.md). On amende donc toujours le
          # commit précédent, un seul vit ici à la fois. `non_fast_forward` ne
          # s'applique qu'à `main` : ce force-push n'a pas besoin de dérogation.
          if git log -1 --format=%ae 2>/dev/null | grep -q '^41898282+github-actions\[bot\]@users.noreply.github.com$'; then
            git commit --amend -m "$MSG"
          else
            git commit -m "$MSG"
          fi
          git push --force-with-lease origin garde-data
